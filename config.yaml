universe: sp500
universes:
  - sp500
  - finland
top_n: 10

# Skip tickers below this market cap (USD)
# Lower values include smaller companies, which can be less liquid and riskier.
# Finnish names use Yahoo's local market-cap currency, so treat this as approximate.
min_market_cap: 100_000_000

# Keep the short-term watchlist away from mega-cap names.
# Raise/lower this if you want larger/smaller companies included.
max_market_cap: 150_000_000_000

filters:
  require_positive_trailing_pe: true
  max_trailing_pe: 60
  max_price_to_book: 8
  require_positive_revenue_growth: false

scoring:
  # Higher weight = more influence on rank (relative-to-sector cheapness)
  trailing_pe: 0.45
  price_to_book: 0.35
  peg_ratio: 0.20
  # Bonus added to score when classic Graham thresholds are met
  graham_bonus: 0.15

short_term_scoring:
  # 1-day to 1-week view: score grouped factors, not duplicate raw signals.
  factor_weights:
    trend: 0.25
    momentum: 0.15
    relative_strength: 0.25
    participation: 0.20
    extension: 0.15
  factor_components:
    trend:
      sma_5_20_ratio: 0.30
      close_vs_sma_20: 0.25
      return_20d: 0.25
      up_day_ratio_10d: 0.20
    momentum:
      return_1d: 0.15
      return_5d: 0.30
      return_10d: 0.30
      return_20d: 0.25
    relative_strength:
      rel_strength_spy_1d: 0.03
      rel_strength_qqq_1d: 0.02
      rel_strength_spy_5d: 0.20
      rel_strength_qqq_5d: 0.15
      rel_strength_spy_10d: 0.25
      rel_strength_qqq_10d: 0.15
      rel_strength_spy_20d: 0.15
      rel_strength_qqq_20d: 0.10
    participation:
      volume_ratio_5d: 0.20
      volume_ratio_20d: 0.20
      volume_trend_5d_20d: 0.15
      volume_persistence_5d: 0.15
      volume_persistence_10d: 0.15
      volume_z_score_20d: 0.10
      dollar_volume: 0.05
    extension:
      rsi_control: 0.30
      atr_14_pct: 0.25
      stretch_vs_atr: 0.20
      distance_from_20d_low: 0.15
      abs_gap_1d: 0.10
