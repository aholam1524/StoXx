universe: sp500
universes:
  - sp500
  - finland
top_n: 10

# Skip tickers below this market cap (USD)
# Lower values include smaller companies, which can be less liquid and riskier.
# Finnish names use Yahoo's local market-cap currency, so treat this as approximate.
min_market_cap: 100_000_000

# Keep the short-term watchlist away from mega-cap names.
# Raise/lower this if you want larger/smaller companies included.
max_market_cap: 150_000_000_000

filters:
  require_positive_trailing_pe: true
  max_trailing_pe: 60
  max_price_to_book: 8
  require_positive_revenue_growth: false

scoring:
  # Higher weight = more influence on rank (relative-to-sector cheapness)
  trailing_pe: 0.45
  price_to_book: 0.35
  peg_ratio: 0.20
  # Bonus added to score when classic Graham thresholds are met
  graham_bonus: 0.15

short_term_scoring:
  # 1-day to 1-week view: momentum + volume + relative strength + trend.
  return_1d: 0.20
  return_5d: 0.25
  return_10d: 0.10
  volume_ratio_5d: 0.18
  volume_ratio_20d: 0.10
  volume_trend_5d_20d: 0.06
  near_5d_high: 0.08
  near_20d_high: 0.05
  rsi_14: 0.10
  relative_spy_5d: 0.14
  relative_qqq_5d: 0.10
  return_20d: 0.05
  sma_5_20_ratio: 0.08
  close_vs_sma_20: 0.06
  up_day_ratio_5d: 0.07
  up_day_ratio_10d: 0.05
  dollar_volume: 0.04
