universe: sp500
universes:
  - sp500
  - sp400
  - finland
top_n: 10

# Skip tickers below this market cap (USD).
# This is low enough to include S&P MidCap 400 names while still filtering very small/liquid names.
# Finnish names use Yahoo's local market-cap currency, so treat this as approximate.
min_market_cap: 100_000_000

# Keep the short-term watchlist away from mega-cap names.
# Raise/lower this if you want larger/smaller companies included.
max_market_cap: 150_000_000_000

filters:
  require_positive_trailing_pe: False
  require_positive_revenue_growth: false

scoring:
  # Higher weight = more influence on rank (relative-to-sector cheapness)
  trailing_pe: 0.45
  price_to_book: 0.35
  peg_ratio: 0.20
  # Bonus added to score when classic Graham thresholds are met
  graham_bonus: 0.15

short_term_scoring:
  # 1-day to 1-week view: score grouped factors, not duplicate raw signals.
  factor_weights:
    trend: 0.25
    momentum: 0.15
    relative_strength: 0.25
    participation: 0.20
    extension: 0.15
  factor_components:
    trend:
      sma_5_20_ratio: 0.35
      close_vs_sma_20: 0.25
      up_day_ratio_10d: 0.15
      close_location_20d: 0.15
      market_regime_score: 0.10
    momentum:
      momentum_acceleration_5d_10d: 0.35
      return_1d: 0.15
      close_location_5d: 0.20
      rs_momentum_5d_20d: 0.15
      price_volume_efficiency_5d: 0.15
    relative_strength:
      rs_momentum_5d_20d: 0.25
      rel_strength_spy_10d: 0.20
      rel_strength_qqq_10d: 0.15
      sector_relative_strength_5d: 0.15
      sector_relative_strength_10d: 0.15
      sector_relative_strength_20d: 0.10
    participation:
      volume_acceleration_5d_20d: 0.15
      volume_ratio_5d: 0.15
      volume_trend_5d_20d: 0.10
      volume_persistence_5d: 0.15
      volume_persistence_10d: 0.15
      volume_z_score_20d: 0.10
      up_volume_ratio_10d: 0.10
      price_volume_efficiency_5d: 0.10
      dollar_volume: 0.05
    extension:
      rsi_control: 0.25
      atr_14_pct: 0.25
      stretch_vs_atr: 0.20
      distance_from_20d_low: 0.15
      abs_gap_1d: 0.10
      failed_gap_or_fade: 0.05
      distribution_pressure: 0.05
  risk_levels:
    low_max: 0.25
    medium_max: 0.50
  risk_weights:
    extension: 0.33
    volatility: 0.20
    liquidity: 0.20
    trend_failure: 0.15
    event: 0.12
  risk_thresholds:
    extension:
      rsi_14: [60, 80]
      return_5d: [0.04, 0.16]
      return_10d: [0.08, 0.24]
      return_20d: [0.10, 0.30]
      distance_from_20d_low: [0.08, 0.28]
      distance_from_20d_high: [-0.08, 0.02]
      stretch_vs_atr: [1.0, 3.5]
    volatility:
      atr_14_pct: [0.02, 0.07]
      abs_gap_1d: [0.01, 0.06]
      abs_return_1d: [0.02, 0.08]
    liquidity:
      dollar_volume: [5_000_000, 100_000_000]
      volume_ratio_5d: [1.5, 4.0]
      volume_persistence_10d: [0.2, 0.8]
    trend_failure:
      close_vs_sma_20: [0.0, 0.08]
      sma_5_20_ratio: [0.0, 0.06]
      up_day_ratio_10d: [0.3, 0.7]
